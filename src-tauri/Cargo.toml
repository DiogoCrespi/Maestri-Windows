[package]
name = "open-maestri-windows"
version = "0.1.0"
description = "Open Maestri native Windows shell"
authors = ["open-maestri contributors"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.88"
build = "build.rs"

[lib]
name = "open_maestri_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "open-maestri-windows"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = ["unstable"] }
tauri-plugin-dialog = "2"
portable-pty = "0.9"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"

[dev-dependencies]
tauri = { version = "2.11", features = ["test"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = [
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
